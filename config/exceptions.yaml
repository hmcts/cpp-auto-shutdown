# Every deviation from the baseline lives here, always dated. Automation reads
# only applied configuration, so `applied: false` has no effect on the
# scheduler — the dashboard surfaces that explicitly so a DM is not misled.
#
# HOUSEKEEPING NEEDED — this block grows without bound.
# CNP prunes the equivalent file daily: .github/workflows/housekeeping_aks_issuejson.yaml
# runs scripts/housekeeping.py, which drops every entry whose end date has passed
# and commits the result. Do the same here, with two differences:
#   - keep a grace period of about 30 days rather than deleting on expiry, so the
#     board's "Finished" group and the calendar still show recent history;
#   - edit with `yq` rather than a YAML load/dump, which would strip these comments.
# Nothing is lost by pruning: Git history remains the full audit trail.
# To be built alongside the issue-form write path.
