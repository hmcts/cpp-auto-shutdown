# Configuration — declared intent. Never written by pipelines.
#
# This is SAMPLE data illustrating the contract described in docs/DESIGN.md.
# Configuration says when a stack SHOULD run; state/environments/*.json records
# what live verification actually observed. The two are kept separate so that
# intent can never be mistaken for observation.

defaults:
  timezone: Europe/London
  startup: "06:00"
  shutdown: "19:00"
  # England & Wales — https://www.api.gov.uk/gds/bank-holidays/
  bank_holidays_source: https://www.gov.uk/bank-holidays.json

# Alterations a request may select. Anything outside these needs approval.
presets:
  shutdown_delay:
    - "21:00"
    - "23:00"
    - "24h"
  weekend:
    - "06:00-19:00"
    - "06:00-21:00"
    - "06:00-23:00"
    - "24h"

