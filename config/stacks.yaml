# Configuration — declared intent. Never written by the action pipelines.
#
# SAMPLE data illustrating the contract in docs/DESIGN.md.
#
# Every stack runs the baseline schedule: 06:00–19:00, weekdays only. There are
# no permanent per-stack alterations — the always-on stacks that existed on the
# EA Confluence page do not carry over. Any deviation is an exception with a
# start and end date, so it expires and has to be re-justified.
#
# Configuration says when a stack SHOULD run; state/environments/*.json records
# what live verification actually observed. The two are kept separate so intent
# can never be mistaken for observation.

defaults:
  timezone: Europe/London
  startup: "06:00"
  shutdown: "19:00"
  weekdays_only: true
  # England & Wales — https://www.api.gov.uk/gds/bank-holidays/
  bank_holidays_source: https://www.gov.uk/bank-holidays.json

# The windows an exception request may ask for. A weekend or bank holiday is
# covered by an exception whose date range includes that day.
exception_windows:
  - "06:00-19:00"   # baseline hours, used to run on a weekend or bank holiday
  - "06:00-21:00"   # delay shutdown to 21:00
  - "06:00-23:00"   # delay shutdown to 23:00
  - "24h"           # run around the clock

