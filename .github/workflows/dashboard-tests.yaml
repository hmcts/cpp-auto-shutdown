name: Dashboard tests

# The dashboard's schedule, model, and loader logic is unit tested with Node's
# built-in runner. Data files are checked separately by data-validation.yaml.

on:
  push:
    paths:
      - 'config/stacks.yaml'
      - 'config/exceptions.yaml'
      - 'docs/js/**'
      - 'tests/dashboard/**'
      - 'package.json'
      - '.github/workflows/dashboard-tests.yaml'
  pull_request:
    paths:
      - 'config/stacks.yaml'
      - 'config/exceptions.yaml'
      - 'docs/js/**'
      - 'tests/dashboard/**'
      - 'package.json'
      - '.github/workflows/dashboard-tests.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run dashboard tests
        run: npm run test:dashboard
